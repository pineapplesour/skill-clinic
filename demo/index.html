<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Clinic Demo</title>
<style>
:root{
  --bg:#f7f8fb; --panel:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --indigo:#4f46e5; --indigo-soft:#eef2ff;
  --term-bg:#0f1117; --term-ink:#d7dae3; --term-dim:#7c8598;
  --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --warn:#a16207; --warn-bg:#fef3c7; --fix:#1d4ed8; --fix-bg:#dbeafe;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Roboto,sans-serif;}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-size:19px;font-weight:700;letter-spacing:-.2px}
.logo span{color:var(--indigo)}
.badge{font-size:11px;padding:3px 9px;border-radius:999px;background:var(--indigo-soft);color:var(--indigo);border:1px solid #dcdffb;font-weight:600}
.badge.replay{background:#fff;color:var(--muted);border:1px dashed #cbd0da;font-weight:500}
.tagline{color:var(--muted);font-size:12.5px;flex:1 1 240px}
.scenarios{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.sc{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:.12s}
.sc small{display:block;color:var(--muted);font-size:11px}
.sc:hover{border-color:#c7cbf5}
.sc.active{border-color:var(--indigo);background:var(--indigo-soft);box-shadow:0 0 0 2px #e6e9fd}
.controls{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
button.primary{background:var(--indigo);color:#fff;border:0;border-radius:9px;padding:9px 18px;font:600 14px/1 inherit;cursor:pointer}
button.primary:disabled{background:#c7cbe6;cursor:default}
button.ghost{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 14px;font:500 13px/1 inherit;cursor:pointer;color:var(--ink)}
.progress{flex:1 1 140px;height:6px;background:#e9eaf2;border-radius:99px;overflow:hidden;min-width:100px}
.progress i{display:block;height:100%;background:var(--indigo);width:0;transition:width .18s}
.hint{color:var(--muted);font-size:12px}
.cols{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.term{background:var(--term-bg);border-radius:12px;padding:14px 14px 16px;height:520px;overflow:auto;font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--term-ink);white-space:pre-wrap;word-break:break-word}
.term .t-head{color:#8b93a7}
.term .cmd{color:#a5b4fc}
.term .dim{color:var(--term-dim)}
.term .g{color:#6ee7a8}.term .r{color:#fca5a5}.term .y{color:#fcd34d}.term .b{color:#93c5fd}
.term .rule{color:#3a4055}
.term .out{color:#9aa3b5;background:#161923;display:block;padding:6px 8px;border-radius:6px;margin:4px 0 2px;border-left:2px solid #2b3145}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;height:520px;overflow:auto}
.panel h3{margin:0 0 4px;font-size:13px;letter-spacing:.02em;color:var(--muted);text-transform:uppercase}
.meta{font-size:12px;color:var(--muted);margin-bottom:10px;word-break:break-all}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
.pill.HEALTHY{background:var(--ok-bg);color:var(--ok)}
.pill.BROKEN{background:var(--bad-bg);color:var(--bad)}
.pill.ENV_SPECIFIC{background:var(--warn-bg);color:var(--warn)}
.pill.pending{background:#eef0f4;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.count{border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;background:#fcfcfe}
.count b{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase}
td code{font:11.5px ui-monospace,Menlo,monospace;background:#f4f5f9;padding:1px 4px;border-radius:4px;word-break:break-all}
.st{font-weight:700;font-size:11px;padding:2px 7px;border-radius:6px}
.st.PASS{background:var(--ok-bg);color:var(--ok)}
.st.FAIL{background:var(--bad-bg);color:var(--bad)}
.st.FIXED{background:var(--fix-bg);color:var(--fix)}
.sev{font-weight:700;font-size:11px;padding:2px 7px;border-radius:6px}
.sev.high{background:var(--bad-bg);color:var(--bad)}
.sev.medium{background:var(--warn-bg);color:var(--warn)}
.sev.low{background:#e0e7ff;color:#3730a3}
.sev.info{background:#eef0f4;color:var(--muted)}
.sec-title{margin:16px 0 2px;font-size:13px;font-weight:700;color:var(--bad)}
.empty{color:var(--muted);font-size:12.5px;padding:24px 4px;text-align:center}
.summary{border:1px solid var(--line);background:#fff;border-radius:12px;padding:18px;margin-top:14px}
.summary h2{margin:0 0 8px;font-size:18px}
.summary ul{margin:8px 0 12px;padding-left:18px;color:#374151}
.summary a{color:var(--indigo);font-weight:600}
.hidden{display:none}
footer{margin-top:16px;color:var(--muted);font-size:11.5px}
</style>
</head>

const ORDER = ["stale","pdf","injected","healthy"];
const REPO = "https://github.com/pineapplesour/skill-clinic";

const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const short = (s,n) => { s=String(s||"").replace(/\n/g," ⏎ "); return s.length>n ? s.slice(0,n-1)+"…" : s; };

/* ---------- 이벤트 스크립트 만들기 (전부 리포트 실제 값) ---------- */
function buildEvents(sc){
  const ev = [];
  ev.push({type:"sandbox", phase:1});
  sc.steps.forEach((s,i)=> ev.push({type:"step", i}));
  const failed = sc.steps.filter(s=>s.category);
  if(failed.length) ev.push({type:"phase2", steps:failed.map(s=>s.index)});
  if(sc.fix_mode){
    const fixes = sc.steps.filter(s=>s.fix_command);
    if(fixes.length) ev.push({type:"phase3", steps:fixes.map(s=>s.index)});
  }
  if(sc.security && sc.security.suspicious) ev.push({type:"security"});
  ev.push({type:"verdict"});
  ev.push({type:"summary"});
  return ev;
}

let cur = "stale", sc = DATA[cur], events = [], pos = 0, shownSteps = [];

const term = document.getElementById("term");
const panel = document.getElementById("panel");
const bar = document.getElementById("bar");
const nextBtn = document.getElementById("next");
const summaryBox = document.getElementById("summary");

function line(html, cls){
  const d = document.createElement("div");
  if(cls) d.className = cls;
  d.innerHTML = html;
  term.appendChild(d);
  term.scrollTop = term.scrollHeight;
}
function stepOf(idx){ return sc.steps.find(s=>s.index===idx); }

/* ---------- 오른쪽 리포트 패널 ---------- */
function renderPanel(opts){
  opts = opts || {};
  const c = sc.counts;
  let h = "";
  h += `<h3>Report</h3>`;
  h += `<div class="meta"><b>${esc(sc.skill)}</b><br>${esc(sc.skill_file)}<br>generated ${esc(sc.generated_at)} · <code>reports/${esc(sc.report_file)}</code></div>`;
  h += opts.verdict
      ? `<span class="pill ${sc.verdict}">Verdict: ${sc.verdict}</span>`
      : `<span class="pill pending">Verdict: 실행 중…</span>`;
  const done = shownSteps.length;
  const tally = {PASS:0,FAIL:0,FIXED:0,INFRA_ERROR:0};
  shownSteps.forEach(i=>{ const s=stepOf(i); const st = (opts.afterFix||s.status!=="FIXED")? s.status : "FAIL"; tally[st]=(tally[st]||0)+1; });
  h += `<div class="counts">
    <div class="count">PASS <b>${tally.PASS}</b></div>
    <div class="count">FAIL <b>${tally.FAIL}</b></div>
    <div class="count">FIXED <b>${tally.FIXED}</b></div>
    <div class="count">INFRA <b>${tally.INFRA_ERROR}</b></div>
    <div class="count">judge <b>${sc.llm_judge ? esc(sc.llm_model ? "nosana:"+sc.llm_model : "llm") : "rules"}</b></div>
  </div>`;
  if(!done){ h += `<div class="empty">아직 실행된 단계가 없습니다.<br>“다음 ▶”을 눌러 보세요.</div>`; }
  else{
    h += `<table><thead><tr><th>#</th><th>Step</th><th>Exit</th><th>Status</th><th>Category</th><th>Judge</th></tr></thead><tbody>`;
    shownSteps.forEach(i=>{
      const s = stepOf(i);
      const st = (opts.afterFix||s.status!=="FIXED") ? s.status : "FAIL";
      h += `<tr><td>${s.index}</td><td>${esc(short(s.title,34))}<br><code>${esc(short(s.command,42))}</code></td>
      <td>${s.exit_code}</td><td><span class="st ${st}">${st}</span></td>
      <td>${s.category?esc(s.category):"–"}</td><td>${s.judge?`<code>${esc(s.judge)}</code>`:"–"}</td></tr>`;
    });
    h += `</tbody></table>`;
  }
  if(opts.security){
    const rows = [];
    sc.steps.forEach(s=> (s.security||[]).forEach(f=> rows.push([s.index,f])));
    const g = sc.security;
    h += `<div class="sec-title">SECURITY findings — high ${g.high} / medium ${g.medium} / low ${g.low} / info ${g.info}</div>`;
    h += `<table><thead><tr><th>#</th><th>Rule</th><th>Sev</th><th>Evidence</th></tr></thead><tbody>`;
    rows.forEach(([i,f])=>{
      h += `<tr><td>${i}</td><td>${esc(f.rule)}<br><span style="color:#6b7280">${esc(f.note)}</span></td>
      <td><span class="sev ${esc(f.severity)}">${esc(f.severity)}</span></td><td><code>${esc(short(f.evidence,60))}</code></td></tr>`;
    });
    h += `</tbody></table>`;
  }
  panel.innerHTML = h;
}

/* ---------- 이벤트 실행 ---------- */
let afterFixShown = false, securityShown = false, verdictShown = false;

function runEvent(e){
  if(e.type==="sandbox"){
    line(`<span class="t-head">$ .venv/bin/python clinic.py ${esc(sc.skill_file.replace("/home/pineapple/skill-clinic/",""))}${sc.fix_mode?" --fix":""}${sc.llm_judge?"":" --no-llm"}</span>`);
    line(`<span class="dim">  [sandbox] creating fresh Daytona sandbox A …</span>`);
    line(`<span class="g">  [sandbox] created</span> <span class="dim">· 업로드 skill.tar.gz → /home/daytona/skill · 총 ${sc.steps.length} steps</span>`);
    line(`<span class="dim">  (샌드박스 ID는 콘솔에만 찍히고 리포트 JSON에는 저장되지 않아 여기서는 생략합니다)</span>`);
    line(`<span class="rule">────────────── PHASE 1 · 단계 실행 (state persists) ──────────────</span>`);
  }
  else if(e.type==="step"){
    const s = sc.steps[e.i];
    line(`<span class="cmd">daytona:~/skill$ ${esc(s.command)}</span>`);
    const okc = s.exit_code===0 ? "g" : "r";
    line(`<span class="${okc}">→ exit ${s.exit_code}</span> <span class="dim">· ${s.seconds}s · ${esc(s.title)}</span>`);
    if(s.output) line(`<span class="out">${esc(s.output)}</span>`);
    shownSteps.push(s.index);
    renderPanel({afterFix:afterFixShown, security:securityShown, verdict:verdictShown});
  }
  else if(e.type==="phase2"){
    line(`<span class="rule">────────────── PHASE 2 · 실패 분류 (judge) ──────────────</span>`);
    e.steps.forEach(i=>{
      const s = stepOf(i);
      line(`<span class="y">  [judge] step ${s.index}</span> <span class="dim">→</span> <span class="b">${esc(s.category)}</span> <span class="dim">(judge: ${esc(s.judge)}, confidence ${s.confidence})</span>`);
      line(`<span class="dim">      ${esc(s.explanation)}</span>`);
      if(s.fix_command) line(`<span class="dim">      proposed fix: </span><span class="cmd">${esc(short(s.fix_command,160))}</span>`);
    });
  }
  else if(e.type==="phase3"){
    line(`<span class="rule">────────────── PHASE 3 · 새 샌드박스에서 수정안 재검증 ──────────────</span>`);
    line(`<span class="dim">  [sandbox] created fresh sandbox B · 통과한 단계 재생 후 fix 실행 (leftover state 금지)</span>`);
    e.steps.forEach(i=>{
      const s = stepOf(i);
      line(`<span class="cmd">daytona-B:~/skill$ ${esc(short(s.fix_command,200))}</span>`);
      if(s.status==="FIXED"){
        line(`<span class="g">→ FIXED</span> <span class="dim">· 두 번째 샌드박스에서 exit 0 확인됨</span>`);
      }else{
        const af = s.after_fix||{};
        line(`<span class="r">→ FAIL</span> <span class="dim">· 재분류: <b>${esc(af.category||s.category)}</b> — ${esc(af.explanation||"")}</span>`);
      }
    });
    afterFixShown = true;
    renderPanel({afterFix:true, security:securityShown, verdict:verdictShown});
  }
  else if(e.type==="security"){
    const g = sc.security;
    line(`<span class="rule">────────────── SECURITY · 주입/의심 동작 ──────────────</span>`);
    line(`<span class="r">  [security] suspicious = true</span> <span class="dim">· high ${g.high} / medium ${g.medium} / low ${g.low} / info ${g.info}</span>`);
    sc.steps.forEach(s=>(s.security||[]).forEach(f=>{
      line(`<span class="${f.severity==="high"?"r":(f.severity==="medium"?"y":"dim")}">  · step ${s.index} ${esc(f.rule)} [${esc(f.severity)}]</span> <span class="dim">${esc(f.note)}</span>`);
    }));
    securityShown = true;
    renderPanel({afterFix:afterFixShown, security:true, verdict:verdictShown});
    const st = panel.querySelector(".sec-title");
    if(st) panel.scrollTop = st.offsetTop - 8;
  }
  else if(e.type==="verdict"){
    const c = sc.counts;
    line(`<span class="rule">──────────────────────────────────────────────</span>`);
    line(`<span class="dim">  steps: PASS ${c.PASS} · FIXED ${c.FIXED} · FAIL ${c.FAIL} · infrastructure errors ${c.INFRA_ERROR}</span>`);
    if(sc.llm_judge) line(`<span class="dim">  judge backends used: nosana:${esc(sc.llm_model)}</span>`);
    else line(`<span class="dim">  judge backends used: rules</span>`);
    line(`<span class="${sc.verdict==="HEALTHY"?"g":(sc.verdict==="BROKEN"?"r":"y")}">  VERDICT: ${sc.verdict}</span>`);
    line(`<span class="dim">  report → reports/${esc(sc.report_file.replace(".json",".{md,json,html}"))}</span>`);
    line(`<span class="dim">  [sandbox] deleted</span>`);
    verdictShown = true;
    renderPanel({afterFix:afterFixShown, security:securityShown, verdict:true});
  }
  else if(e.type==="summary"){
    showSummary();
  }
}

function showSummary(){
  const c = sc.counts;
  const judge = sc.llm_judge ? `nosana:${esc(sc.llm_model)} (Nosana 호스티드 추론)` : "rules (결정론적 분류기)";
  let sec = "";
  if(sc.security && sc.security.suspicious){
    sec = `<li>SECURITY: high ${sc.security.high} · medium ${sc.security.medium} · low ${sc.security.low} · info ${sc.security.info} — 스킬 단계에 심어진 자격증명 유출·원격 코드 실행·지속성 동작이 실행 기록에서 탐지됐습니다.</li>`;
  }
  summaryBox.innerHTML = `
    <h2>요약 — <code>${esc(sc.skill)}</code> · <span class="pill ${sc.verdict}">${sc.verdict}</span></h2>
    <ul>
      <li>단계 ${sc.steps.length}개 실행: PASS ${c.PASS} · FIXED ${c.FIXED} · FAIL ${c.FAIL} · INFRA_ERROR ${c.INFRA_ERROR}</li>
      <li>분류 judge: ${judge}</li>
      <li>수정 재검증: ${sc.fix_mode ? "새 샌드박스에서 재실행 (<code>--fix</code>)" : "이번 실행에서는 사용 안 함"}</li>
      ${sec}
      <li>증거 리포트: <code>reports/${esc(sc.report_file)}</code> (.md / .json / .html 동시 생성)</li>
    </ul>
    <p>다른 시나리오도 위에서 골라 보세요 · <a href="${REPO}" target="_blank" rel="noopener">github.com/pineapplesour/skill-clinic</a></p>`;
  summaryBox.classList.remove("hidden");
}

/* ---------- 컨트롤 ---------- */
function advance(){
  if(pos>=events.length) return;
  runEvent(events[pos++]);
  bar.style.width = Math.round(pos/events.length*100)+"%";
  if(pos>=events.length){
    nextBtn.disabled = true;
    nextBtn.textContent = "완료 ✓";
    document.getElementById("hint").textContent = "“처음부터”로 다시 보거나 위에서 다른 시나리오를 고르세요.";
  }else{
    nextBtn.textContent = `다음 ▶  (${pos}/${events.length})`;
  }
}

function start(key){
  cur = key; sc = DATA[key];
  events = buildEvents(sc); pos = 0; shownSteps = [];
  afterFixShown = securityShown = verdictShown = false;
  term.innerHTML = ""; summaryBox.classList.add("hidden"); summaryBox.innerHTML = "";
  nextBtn.disabled = false; nextBtn.textContent = `다음 ▶  (0/${events.length})`;
  bar.style.width = "0%";
  document.getElementById("hint").textContent = "Space / → 키로도 진행";
  line(`<span class="t-head">Skill Clinic · ${esc(sc.label)} — 리포트 재생 (${esc(sc.generated_at)})</span>`);
  line(`<span class="dim">“다음 ▶”을 누르면 실제 실행 기록이 한 줄씩 재생됩니다.</span>`);
  renderPanel({});
  document.querySelectorAll(".sc").forEach(b=> b.classList.toggle("active", b.dataset.k===key));
}

const scBox = document.getElementById("scenarios");
ORDER.forEach(k=>{
  const b = document.createElement("button");
  b.className = "sc"; b.dataset.k = k;
  b.innerHTML = `${esc(DATA[k].label)}<small>${esc(DATA[k].sub)} · ${DATA[k].verdict}</small>`;
  b.onclick = ()=> start(k);
  scBox.appendChild(b);
});
nextBtn.onclick = advance;
document.getElementById("reset").onclick = ()=> start(cur);
document.addEventListener("keydown", e=>{
  if(e.key===" "||e.key==="ArrowRight"){ e.preventDefault(); advance(); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); start(cur); }
});
start("stale");
</script>
